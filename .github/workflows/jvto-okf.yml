name: JVTO OKF Validation

on:
  pull_request:
    paths:
      - 'okf/bundles/jvto/**'
      - 'okf/jvto/**'
      - 'okf/customer-sales-release/jvto/**'
  push:
    branches: [main]
    paths:
      - 'okf/bundles/jvto/**'
      - 'okf/jvto/**'
      - 'okf/customer-sales-release/jvto/**'
  # Lets JVTO_WEB_DISPATCH_TOKEN be verified on demand (Actions -> JVTO OKF
  # Validation -> Run workflow) without needing a real content push.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: okf/jvto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .[dev]
      - run: python -m unittest discover -s tests -v
      # Rebuild the bundle from curation and fail if the committed bundle has drifted, so
      # "70 concepts, no bundle diff" is a CI guard rather than a locally-reported result.
      - run: python scripts/build_bundle.py --curated --indexes
      - run: git -C "$GITHUB_WORKSPACE" diff --exit-code -- okf/bundles/jvto
      - run: python scripts/validate_okf.py --strict-links
      - run: python scripts/validate_okf.py --release --strict-links

      # jvto-web consumes okf/customer-sales-release/jvto/*.json directly (see
      # jvto-web's scripts/sync-okf.mjs). Two independent gates guard it, both
      # before the dispatch step below so a bad release blocks the notify rather
      # than propagating to jvto-web:
      #  (1) validate_customer_sales_release.py — content/leak check on the
      #      committed files directly (missing files, malformed records, leaked
      #      private/internal/PII fields). Needs no external checkout.
      - run: python scripts/validate_customer_sales_release.py

      #  (2) verify_customer_sales_release.py — REBUILD-AND-DIFF reproducibility
      #      gate (the release analog of the build_bundle.py no-diff guard
      #      above). Rebuilds the release from its DECLARED sources — the current
      #      OKF catalog + a jvto-itinerary-core checkout pinned to the revision
      #      in source-lock.json — and fails if any deterministic artifact
      #      drifted (hand-edit, or an OKF concept change not propagated into the
      #      release). Secret-guarded on GH_PAT (read access to the private
      #      itinerary-core): until that secret is configured on this repo the
      #      gate self-skips with a notice rather than hard-failing.
      - name: Resolve release-gate config
        id: gate
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GH_PAT not set — customer-sales-release reproducibility gate skipped. Add GH_PAT (read access to sambuko82/jvto-itinerary-core) to enable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
          rev="$(python -c "import json; print(json.load(open('$GITHUB_WORKSPACE/okf/customer-sales-release/jvto/source-lock.json'))['itinerary_core']['revision'])")"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      - name: Checkout jvto-itinerary-core (pinned to source-lock revision)
        if: steps.gate.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: sambuko82/jvto-itinerary-core
          ref: ${{ steps.gate.outputs.rev }}
          path: jvto-itinerary-core
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Verify customer-sales-release reproducibility
        if: steps.gate.outputs.configured == 'true'
        run: python scripts/verify_customer_sales_release.py --core-root "$GITHUB_WORKSPACE/jvto-itinerary-core"

      # After a merge to main, notify jvto-web to sync the freshly-updated
      # customer-sales-release artifacts (only reached if the validation step
      # above passed). Mirrors llm-wiki's ci.yml dispatch step. Token is read
      # from a secret and never printed; continue-on-error so a not-yet-
      # configured secret doesn't fail the whole job — it fails only this step.
      - name: Notify jvto-web (repository_dispatch)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.JVTO_WEB_DISPATCH_TOKEN }}
        run: |
          gh api -X POST repos/jvto-devteam/jvto-web/dispatches \
            -f event_type=okf-main-updated \
            -f "client_payload[sha]=${GITHUB_SHA}"
