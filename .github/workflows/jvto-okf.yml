name: JVTO OKF Validation

on:
  pull_request:
    paths:
      - 'okf/bundles/jvto/**'
      - 'okf/jvto/**'
      - 'okf/customer-sales-release/jvto/**'
  push:
    branches: [main]
    paths:
      - 'okf/bundles/jvto/**'
      - 'okf/jvto/**'
      - 'okf/customer-sales-release/jvto/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: okf/jvto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .[dev]
      - run: python -m unittest discover -s tests -v
      # Rebuild the bundle from curation and fail if the committed bundle has drifted, so
      # "70 concepts, no bundle diff" is a CI guard rather than a locally-reported result.
      - run: python scripts/build_bundle.py --curated --indexes
      - run: git -C "$GITHUB_WORKSPACE" diff --exit-code -- okf/bundles/jvto
      - run: python scripts/validate_okf.py --strict-links
      - run: python scripts/validate_okf.py --release --strict-links

      # jvto-web consumes okf/customer-sales-release/jvto/*.json directly (see
      # jvto-web's scripts/sync-okf.mjs) — until this run, a push touching only
      # that directory triggered no CI at all (path filter above didn't cover
      # it), so a bad release could reach jvto-web unvalidated. Rebuilding it
      # requires a jvto-itinerary-core checkout (scripts/build_customer_sales_
      # release.py --core-root), which this repo doesn't have access to here —
      # only a path-trigger + notify step is added; a rebuild-and-diff gate for
      # this artifact is a follow-up once that checkout is wired in.

      # After a merge to main, notify jvto-web to sync the freshly-updated
      # customer-sales-release artifacts. Mirrors llm-wiki's ci.yml dispatch
      # step exactly. Token is read from a secret and never printed; if the
      # secret isn't yet configured on this repo, this step fails harmlessly
      # (auth error) without affecting the validate job above.
      - name: Notify jvto-web (repository_dispatch)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.JVTO_WEB_DISPATCH_TOKEN }}
        run: |
          gh api -X POST repos/jvto-devteam/jvto-web/dispatches \
            -f event_type=okf-master-updated \
            -f "client_payload[sha]=${GITHUB_SHA}"
